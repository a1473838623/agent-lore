<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>agent-lore</title>
<style>
:root{
  --bg:#fbfbfa; --panel:#fff; --fg:#1a1a1a; --dim:#6b6b6b; --faint:#9a9a9a;
  --line:#e6e4e0; --line2:#f0eeeb;
  --accent:#2563eb; --accent-bg:#eff4ff;
  --ok:#0a7a52; --ok-bg:#e8f6f0; --warn:#b45309; --warn-bg:#fdf3e3; --bad:#c0392b; --bad-bg:#fdeeec;
  --add-bg:#e9f7ef; --del-bg:#fdeeed;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#141414; --panel:#1c1c1c; --fg:#ececec; --dim:#a0a0a0; --faint:#6e6e6e;
  --line:#2e2e2e; --line2:#242424;
  --accent:#5b8cff; --accent-bg:#1a2340;
  --ok:#3ddc97; --ok-bg:#12261e; --warn:#e0a350; --warn-bg:#2a2013; --bad:#ff7b6b; --bad-bg:#2b1816;
  --add-bg:#132a1e; --del-bg:#2c1917;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.65 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
.wrap{max-width:940px;margin:0 auto;padding:20px 20px 64px}

/* ── 顶栏 ── */
header{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
header h1{font-size:16px;margin:0;letter-spacing:.2px}
header .repo{color:var(--dim);font-size:12px;font-family:ui-monospace,Consolas,monospace}
header .sp{flex:1}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);
  color:var(--fg);border-radius:6px;padding:5px 11px;transition:.12s}
button:hover{border-color:var(--faint)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{opacity:.88}
button.ghost{border-color:transparent;color:var(--dim);padding:5px 8px}
button.ghost:hover{background:var(--line2);color:var(--fg)}
button:disabled{opacity:.45;cursor:default}

/* ── 状态条 ── */
.stats{display:flex;gap:0;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;overflow:hidden;margin-bottom:14px}
.stat{flex:1;padding:11px 14px;border-right:1px solid var(--line2);min-width:0}
.stat:last-child{border-right:0}
.stat b{display:block;font-size:19px;font-variant-numeric:tabular-nums;line-height:1.25}
.stat span{color:var(--dim);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.stat.hot b{color:var(--warn)}

/* ── 需求边界 ── */
.scope{background:var(--accent-bg);border:1px solid var(--accent);border-radius:10px;
  padding:11px 14px;margin-bottom:14px;font-size:13px}
.scope .t{font-weight:600;margin-bottom:3px}
.scope .l{color:var(--dim);font-size:12.5px}
.scope-set{display:flex;gap:8px;margin-bottom:14px}
.scope-set input{flex:1;font:inherit;padding:6px 10px;border:1px solid var(--line);
  border-radius:6px;background:var(--panel);color:var(--fg);min-width:0}

/* ── 分区 ── */
section{margin-bottom:22px}
h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);
  margin:0 0 9px;font-weight:600;display:flex;align-items:center;gap:8px}
h2 .n{background:var(--line2);color:var(--dim);border-radius:20px;
  padding:1px 8px;font-size:11px;letter-spacing:0}
h2.todo{color:var(--warn)} h2.todo .n{background:var(--warn-bg);color:var(--warn)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:13px 15px;margin-bottom:9px}
.card.act{border-color:var(--warn)}
.meta{color:var(--faint);font-size:11.5px;font-family:ui-monospace,Consolas,monospace;
  display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.rule{font-size:13.5px;line-height:1.55}

/* ── diff ── */
pre.diff{margin:9px 0 0;border:1px solid var(--line2);border-radius:7px;overflow:auto;
  font:12px/1.55 ui-monospace,Consolas,monospace;max-height:230px;background:var(--bg)}
pre.diff div{padding:1px 10px;white-space:pre-wrap;word-break:break-all}
pre.diff .a{background:var(--add-bg);color:var(--ok)}
pre.diff .d{background:var(--del-bg);color:var(--bad)}

/* ── 归因操作 ── */
.acts{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.form{margin-top:11px;padding-top:11px;border-top:1px dashed var(--line);display:none}
.form.on{display:block}
.form label{display:block;font-size:12px;color:var(--dim);margin-bottom:5px}
.form textarea{width:100%;font:13px/1.55 inherit;padding:8px 10px;border:1px solid var(--line);
  border-radius:6px;background:var(--bg);color:var(--fg);resize:vertical;min-height:58px}
.form .row{display:flex;gap:8px;align-items:center;margin-top:9px;flex-wrap:wrap}
.form select{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:6px;
  background:var(--panel);color:var(--fg)}
.hint{color:var(--faint);font-size:11.5px}

/* ── tabs ── */
nav.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:13px}
nav.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;
  padding:8px 13px;color:var(--dim);background:none}
nav.tabs button.on{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
nav.tabs button:hover{color:var(--fg)}

.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;
  font-variant-numeric:tabular-nums}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.dim{background:var(--line2);color:var(--dim)}

.bar{height:4px;background:var(--line2);border-radius:3px;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}

.empty{color:var(--faint);font-size:13px;padding:22px;text-align:center;
  border:1px dashed var(--line);border-radius:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);
  color:var(--bg);padding:9px 17px;border-radius:8px;font-size:13px;opacity:0;
  transition:.2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.paused{color:var(--warn);font-size:11.5px}
</style>

<body><div class="wrap" id="app"></div><div class="toast" id="toast"></div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const base = (p) => String(p).split(/[\\/]/).pop();

let D = null;                  // 最近一次数据
let tab = 'conv';              // 当前 tab
let dirty = false;             // 有未提交的输入 → 暂停自动刷新，别把人打断
let busy = false;

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2200);
}

async function post(url, body) {
  busy = true;
  try {
    const r = await (await fetch(url, {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body || {}),
    })).json();
    return r;
  } finally { busy = false; }
}

let lastSig = null;

/** 数据指纹：只取会影响渲染的部分，避免时间戳之类的噪声导致假变化 */
function signature(d) {
  return JSON.stringify([
    d.repo, d.spec && d.spec.id, d.conventions, d.pitfalls.map(p => p.rule),
    d.pending.map(p => p.id), d.ready.map(r => r.key + r.count),
    d.candidates.map(c => c.key + c.count), d.stats.totalInjects, d.stats.totalInjectedTokens,
    d.stats.rules.map(r => r.key + r.before + r.after + r.injected),
  ]);
}

async function load(force) {
  if (!force && (dirty || busy)) return;      // 正在填表就不刷新
  const next = await (await fetch('/api')).json();
  const sig = signature(next);

  // 数据没变就一个 DOM 节点都不动 —— 否则每 5 秒整页重建，
  // 用户滚到一半的 diff 会被弹回顶部
  if (!force && sig === lastSig) { D = next; return; }

  // 真要重渲染时，把滚动位置存下来再还原
  const pageY = window.scrollY;
  const scrolls = {};
  document.querySelectorAll('pre.diff').forEach((el, i) => {
    const k = el.closest('.card') ? el.closest('.card').id || ('i' + i) : ('i' + i);
    if (el.scrollTop) scrolls[k] = el.scrollTop;
  });

  D = next; lastSig = sig;
  render();

  document.querySelectorAll('pre.diff').forEach((el, i) => {
    const k = el.closest('.card') ? el.closest('.card').id || ('i' + i) : ('i' + i);
    if (scrolls[k]) el.scrollTop = scrolls[k];
  });
  window.scrollTo(0, pageY);
}

/* ────────── 渲染 ────────── */
function render() {
  const d = D, s = d.stats;
  const todo = d.pending.length + d.ready.length;

  const H = [];
  H.push(`<header>
    <h1>agent-lore</h1><span class="repo">${esc(d.repo)}</span><span class="sp"></span>
    ${dirty ? '<span class="paused">编辑中 · 已暂停自动刷新</span>' : ''}
    <button class="ghost" onclick="scanNow()">扫描修正</button>
    <button class="ghost" onclick="load(true)">刷新</button>
  </header>`);

  // 需求边界
  H.push(d.spec ? `<div class="scope">
      <div class="t">🎯 ${esc(d.spec.id)}</div>
      ${d.spec.scope ? `<div class="l">范围内：${esc(d.spec.scope)}</div>` : ''}
      ${(d.spec.out || []).length ? `<div class="l">不在范围：${esc(d.spec.out.join('；'))}</div>` : ''}
      <div style="margin-top:8px"><button class="ghost" onclick="clearScope()">结束这个需求</button></div>
    </div>`
    : `<div class="scope-set">
      <input id="spec-id" placeholder="当前需求（例：REQ-118 payment callback idempotency）">
      <input id="spec-scope" placeholder="范围内做什么">
      <button onclick="setScope()">设边界</button>
    </div>`);

  // 状态条
  H.push(`<div class="stats">
    ${stat(d.conventions.length, '已确认规范')}
    ${stat(d.pitfalls.length, '踩坑记录')}
    ${stat(d.candidates.length, '候选规范')}
    ${stat(todo, '待你处理', todo > 0)}
    ${stat(s.totalInjects, '注入次数')}
    ${stat(s.totalInjectedTokens, '注入 token')}
  </div>`);

  // ── 待办：置顶，没有就不出现 ──
  if (d.ready.length) {
    H.push(`<section><h2 class="todo">待确认入库 <span class="n">${d.ready.length}</span></h2>
      ${d.ready.map(readyCard).join('')}</section>`);
  }
  if (d.pending.length) {
    H.push(`<section><h2 class="todo">待归因 <span class="n">${d.pending.length}</span>
        <span style="flex:1"></span>
        <button class="primary" onclick="autoAll()" ${d.hasApiKey ? '' : 'disabled'}>⚡ 全部自动归因</button>
      </h2>
      ${d.hasApiKey ? '' : `<div class="hint" style="margin:-2px 0 9px">
        自动归因需要设置 ANTHROPIC_API_KEY 环境变量。没有 key 时用
        <code>lore review</code> 把提示词交给当前 harness 里的模型判断，再回灌结果。</div>`}
      ${d.pending.map(pendingCard).join('')}</section>`);
  }

  // ── 观测：tabs ──
  const tabs = [
    ['conv', '规范', d.conventions.length],
    ['pit', '踩坑', d.pitfalls.length],
    ['cand', '候选进度', d.candidates.length],
    ['eff', '效果', s.rules.length],
  ];
  H.push(`<nav class="tabs">${tabs.map(([k, label, n]) =>
    `<button class="${tab === k ? 'on' : ''}" onclick="go('${k}')">${label}${n ? ` <span class="pill dim">${n}</span>` : ''}</button>`
  ).join('')}</nav><div id="panel">${panel()}</div>`);

  $('#app').innerHTML = H.join('');
}

const stat = (v, label, hot) =>
  `<div class="stat${hot ? ' hot' : ''}"><b>${v}</b><span>${label}</span></div>`;

function diffHtml(t) {
  return '<pre class="diff">' + String(t).split('\n').map(l =>
    `<div class="${l.startsWith('+') ? 'a' : l.startsWith('-') ? 'd' : ''}">${esc(l) || '&nbsp;'}</div>`
  ).join('') + '</pre>';
}

/* 待归因卡片 —— 三个按钮 + 就地填 rule，不用回命令行 */
function pendingCard(p) {
  return `<div class="card act" id="c-${p.id}">
    <div class="meta"><span>${esc(base(p.file))}</span><span>${p.hunks} 处改动</span>
      <span>AI 写完 ${p.ageMin} 分钟后被改</span><span>${esc(p.id)}</span></div>
    ${diffHtml(p.diff)}
    <div class="acts">
      <button class="primary" onclick="pick('${p.id}','style')">🎨 规范修正</button>
      <button onclick="pick('${p.id}','bug')">🐛 修复缺陷</button>
      <button class="ghost" onclick="drop('${p.id}')">📦 业务变更 · 丢弃</button>
    </div>
    <div class="form" id="f-${p.id}">
      <label id="l-${p.id}"></label>
      <textarea id="r-${p.id}" oninput="dirty=true"
        placeholder="Write the rule in English, e.g. Inject Spring bean dependencies via constructor, not @Autowired field injection"></textarea>
      <div class="row">
        <select id="cf-${p.id}">
          <option value="0.95">很确定</option>
          <option value="0.85" selected>比较确定</option>
          <option value="0.6">不太确定（低于闸门 ${D.stats && 0.75}，会被丢弃）</option>
        </select>
        <button class="primary" onclick="submit('${p.id}')">提交</button>
        <button class="ghost" onclick="cancel('${p.id}')">取消</button>
        <span class="hint">写成可复用的一般陈述，不要提具体变量名</span>
      </div>
    </div>
  </div>`;
}

/* 达阈值但没够格自动入库的 —— 必须说清楚"为什么还要问你" */
function readyCard(r) {
  const A = D.autoRule || {};
  const why = [];
  if (r.related && r.related.length) {
    why.push(`与已有规范话题重叠 —— <b>重复还是冲突，相似度判不出来，只能你看</b>`);
  }
  if (r.avgConfidence < (A.minAvgConfidence || 0.9)) {
    why.push(`归因平均置信度 ${r.avgConfidence}，低于自动入库线 ${A.minAvgConfidence}`);
  }
  if (r.count < (A.minCount || 5)) {
    why.push(`累计 ${r.count} 次，未达自动入库线 ${A.minCount} 次`);
  }

  return `<div class="card act">
    <div class="rule">${esc(r.rule)}</div>
    <div class="meta" style="margin:8px 0 0">
      <span>累计 ${r.count} 次</span><span>置信度 ${r.avgConfidence}</span>
      <span>${r.files.length} 个文件</span><span>${esc(r.key)}</span></div>
    ${why.length ? `<div class="hint" style="margin-top:7px">需要你确认：${why.join('；')}</div>` : ''}
    ${(r.related || []).map(x =>
      `<div class="hint" style="margin-top:4px">↔ 相关已有规范（${x.sim.toFixed(2)}）：${esc(x.existing)}</div>`).join('')}
    <div class="acts">
      <button class="primary" onclick="confirmRule('${r.key}')">✓ 确认入库</button>
    </div>
  </div>`;
}

function panel() {
  const d = D, s = d.stats;
  if (tab === 'conv') {
    if (!d.conventions.length) return `<div class="empty">还没有已确认的规范</div>`;
    return `<div style="margin-bottom:9px"><button onclick="sync(false)">同步到项目 CLAUDE.md</button>
      <button onclick="sync(true)">同步到用户级 CLAUDE.md</button></div>` +
      d.conventions.map(c => `<div class="card"><div class="rule">${esc(c)}</div></div>`).join('');
  }
  if (tab === 'pit') {
    if (!d.pitfalls.length) return `<div class="empty">还没有踩坑记录</div>`;
    return d.pitfalls.map(p => `<div class="card"><div class="rule">${esc(p.rule)}</div>
      <div class="meta" style="margin:7px 0 0"><span>${esc(base(p.file))}</span></div></div>`).join('');
  }
  if (tab === 'cand') {
    if (!d.candidates.length) return `<div class="empty">还没有候选规范。候选累计 ${d.threshold} 次才会升格</div>`;
    return d.candidates.map(c => {
      const pct = Math.min(100, Math.round(c.count / c.threshold * 100));
      return `<div class="card"><div class="rule">${esc(c.rule)}</div>
        <div class="meta" style="margin:8px 0 0"><span>${c.count} / ${c.threshold} 次</span>
          <span>${c.files.length} 个文件</span></div>
        <div class="bar"><i style="width:${pct}%"></i></div></div>`;
    }).join('');
  }
  // 效果
  if (!s.rules.length) return `<div class="empty">还没有已入库的规范，无法统计复发率</div>`;
  return `<div class="card" style="background:none;border-style:dashed">
      <div class="meta" style="margin:0"><span>注入 ${s.totalInjects} 次</span>
        <span>累计 ${s.totalInjectedTokens} token</span>
        <span>命中率 ${(s.hitRate * 100).toFixed(0)}%</span></div>
      <div class="hint" style="margin-top:6px">规范入库后，同类人工修正应当下降。注入次数为 0 时不能下结论 —— 要能区分"规范没用"和"注入没生效"。</div>
    </div>` +
    s.rules.map(r => {
      const cls = r.verdict.startsWith('✅') ? 'ok' : r.verdict.startsWith('🟡') ? 'warn'
                : r.verdict.startsWith('❌') ? 'bad' : 'dim';
      return `<div class="card"><div class="rule">${esc(r.rule)}</div>
        <div class="meta" style="margin:8px 0 0">
          <span>入库前 ${r.before} 次 → 入库后 ${r.after} 次</span>
          <span>注入 ${r.injected} 次</span></div>
        <div style="margin-top:7px"><span class="pill ${cls}">${esc(r.verdict)}</span></div></div>`;
    }).join('');
}

/* ────────── 交互 ────────── */
function go(k) { tab = k; render(); }

function pick(id, label) {
  const f = document.getElementById('f-' + id);
  f.classList.add('on');
  f.dataset.label = label;
  document.getElementById('l-' + id).textContent =
    label === 'style' ? '这条规范是什么？（会进 CLAUDE.md，所以用英文）'
                      : '这个坑是什么？（会在编辑该文件前注入，所以用英文）';
  document.getElementById('r-' + id).focus();
  dirty = true;
}

function cancel(id) {
  document.getElementById('f-' + id).classList.remove('on');
  dirty = false;
}

async function submit(id) {
  const f = document.getElementById('f-' + id);
  const rule = document.getElementById('r-' + id).value.trim();
  if (!rule) return toast('先写一句规范');

  // 兜底：select 取不到有效值时会得到 NaN/0，那会让这条被置信度闸静默丢掉。
  // UI 出岔子不该导致数据丢失 —— 拿不到就按默认档走。
  const raw = Number(document.getElementById('cf-' + id).value);
  const confidence = Number.isFinite(raw) && raw > 0 ? raw : 0.85;

  const r = await post('/api/learn', { id, label: f.dataset.label, rule, confidence });
  dirty = false;
  const auto = (r.autoPromoted || []).length;
  toast(!r.ok ? '已丢弃：' + r.why
      : r.kind === 'pitfall' ? '已记为踩坑'
      : `规范候选 ${r.count}/${r.threshold}`
        + (r.count >= r.threshold ? ' · 已达阈值' : '')
        + (auto ? ` · ${auto} 条已自动入库` : ''));
  load(true);
}

/** 一键批量归因。没有 API key 时给降级路径，而不是干瞪眼 */
async function autoAll() {
  toast('正在归因…');
  const r = await post('/api/auto', {});
  if (!r.ok) return toast(r.why);
  const auto = (r.autoPromoted || []).length;
  toast(r.done
    ? `归因 ${r.done} 条：保留 ${r.kept}，丢弃 ${r.dropped}` + (auto ? ` · ${auto} 条自动入库` : '')
    : r.why);
  load(true);
}

async function drop(id) { await post('/api/dismiss', { id }); dirty = false; toast('已丢弃'); load(true); }

async function confirmRule(key) {
  const r = await post('/api/promote', { key });
  toast(r.ok ? '已入库' : r.why); load(true);
}

async function sync(global) {
  const r = await post('/api/sync', { global });
  toast(!r.written ? r.reason : r.verified ? `${r.count} 条已写入 ${global ? '用户级' : '项目'} CLAUDE.md`
        : `写入未生效（期望 ${r.count}，实际 ${r.actual}）`);
}

async function scanNow() {
  const r = await post('/api/scan', {});
  toast(r.found ? `捕获 ${r.found} 处人工修正` : '没有新的人工修正');
  load(true);
}

async function setScope() {
  const id = $('#spec-id').value.trim();
  if (!id) return toast('先填需求名');
  await post('/api/spec', { id, scope: $('#spec-scope').value.trim(), out: [] });
  toast('边界已设置，之后每次编辑前都会注入'); load(true);
}

async function clearScope() { await post('/api/spec', { clear: true }); toast('已结束'); load(true); }

load(true);
setInterval(() => load(false), 5000);
</script>
