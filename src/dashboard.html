<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>agent-lore</title>
<style>
:root{
  --bg:#fbfbfa; --panel:#fff; --fg:#1a1a1a; --dim:#6b6b6b; --faint:#9a9a9a;
  --line:#e6e4e0; --line2:#f0eeeb;
  --accent:#2563eb; --accent-bg:#eff4ff;
  --ok:#0a7a52; --ok-bg:#e8f6f0; --warn:#b45309; --warn-bg:#fdf3e3; --bad:#c0392b; --bad-bg:#fdeeec;
  --add-bg:#e9f7ef; --del-bg:#fdeeed;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#141414; --panel:#1c1c1c; --fg:#ececec; --dim:#a0a0a0; --faint:#6e6e6e;
  --line:#2e2e2e; --line2:#242424;
  --accent:#5b8cff; --accent-bg:#1a2340;
  --ok:#3ddc97; --ok-bg:#12261e; --warn:#e0a350; --warn-bg:#2a2013; --bad:#ff7b6b; --bad-bg:#2b1816;
  --add-bg:#132a1e; --del-bg:#2c1917;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.65 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
.wrap{max-width:940px;margin:0 auto;padding:20px 20px 64px}

/* ── 顶栏 ── */
header{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
header h1{font-size:16px;margin:0;letter-spacing:.2px}
header .repo{color:var(--dim);font-size:12px;font-family:ui-monospace,Consolas,monospace}
header .sp{flex:1}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);
  color:var(--fg);border-radius:6px;padding:5px 11px;transition:.12s}
button:hover{border-color:var(--faint)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{opacity:.88}
button.ghost{border-color:transparent;color:var(--dim);padding:5px 8px}
button.ghost:hover{background:var(--line2);color:var(--fg)}
button:disabled{opacity:.45;cursor:default}

/* ── 状态条 ── */
.stats{display:flex;gap:0;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;overflow:hidden;margin-bottom:14px}
.stat{flex:1;padding:11px 14px;border-right:1px solid var(--line2);min-width:0}
.stat:last-child{border-right:0}
.stat b{display:block;font-size:19px;font-variant-numeric:tabular-nums;line-height:1.25}
.stat span{color:var(--dim);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.stat.hot b{color:var(--warn)}

/* ── 需求边界 ── */
.scope{background:var(--accent-bg);border:1px solid var(--accent);border-radius:10px;
  padding:11px 14px;margin-bottom:14px;font-size:13px}
.scope .t{font-weight:600;margin-bottom:3px}
.scope .l{color:var(--dim);font-size:12.5px}
.scope-set{display:flex;gap:8px;margin-bottom:14px}
.scope-set input{flex:1;font:inherit;padding:6px 10px;border:1px solid var(--line);
  border-radius:6px;background:var(--panel);color:var(--fg);min-width:0}

/* ── 分区 ── */
section{margin-bottom:22px}
h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);
  margin:0 0 9px;font-weight:600;display:flex;align-items:center;gap:8px}
h2 .n{background:var(--line2);color:var(--dim);border-radius:20px;
  padding:1px 8px;font-size:11px;letter-spacing:0}
h2.todo{color:var(--warn)} h2.todo .n{background:var(--warn-bg);color:var(--warn)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:13px 15px;margin-bottom:9px}
.card.act{border-color:var(--warn)}
.meta{color:var(--faint);font-size:11.5px;font-family:ui-monospace,Consolas,monospace;
  display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.rule{font-size:13.5px;line-height:1.55}

/* ── diff ── */
pre.diff{margin:9px 0 0;border:1px solid var(--line2);border-radius:7px;overflow:auto;
  font:12px/1.55 ui-monospace,Consolas,monospace;max-height:230px;background:var(--bg)}
pre.diff div{padding:1px 10px;white-space:pre-wrap;word-break:break-all}
pre.diff .a{background:var(--add-bg);color:var(--ok)}
pre.diff .d{background:var(--del-bg);color:var(--bad)}

/* ── 归因操作 ── */
.acts{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.form{margin-top:11px;padding-top:11px;border-top:1px dashed var(--line);display:none}
.form.on{display:block}
.form label{display:block;font-size:12px;color:var(--dim);margin-bottom:5px}
.form textarea{width:100%;font:13px/1.55 inherit;padding:8px 10px;border:1px solid var(--line);
  border-radius:6px;background:var(--bg);color:var(--fg);resize:vertical;min-height:58px}
.form .row{display:flex;gap:8px;align-items:center;margin-top:9px;flex-wrap:wrap}
.form select{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:6px;
  background:var(--panel);color:var(--fg)}
.hint{color:var(--faint);font-size:11.5px}

/* ── tabs ── */
nav.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:13px}
nav.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;
  padding:8px 13px;color:var(--dim);background:none}
nav.tabs button.on{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
nav.tabs button:hover{color:var(--fg)}

.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;
  font-variant-numeric:tabular-nums}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.dim{background:var(--line2);color:var(--dim)}

.bar{height:4px;background:var(--line2);border-radius:3px;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--dim);
  border-radius:20px;padding:3px 11px;font-size:12px}
.chip:hover{color:var(--fg)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.grp{font-size:11.5px;color:var(--faint);letter-spacing:.5px;text-transform:uppercase;
  margin:14px 0 7px;font-weight:600;display:flex;align-items:center;gap:7px}
.grp:first-child{margin-top:0}
.empty{color:var(--faint);font-size:13px;padding:22px;text-align:center;
  border:1px dashed var(--line);border-radius:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);
  color:var(--bg);padding:9px 17px;border-radius:8px;font-size:13px;opacity:0;
  transition:.2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.paused{color:var(--warn);font-size:11.5px}
</style>

<body><div class="wrap" id="app"></div><div class="toast" id="toast"></div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const base = (p) => String(p).split(/[\\/]/).pop();

let D = null;                  // 最近一次数据
let tab = 'conv';              // 当前 tab
let dirty = false;             // 有未提交的输入 → 暂停自动刷新，别把人打断
let busy = false;

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2200);
}

async function post(url, body) {
  busy = true;
  try {
    const r = await (await fetch(url, {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body || {}),
    })).json();
    return r;
  } finally { busy = false; }
}

let lastSig = null;

/** 数据指纹：只取会影响渲染的部分，避免时间戳之类的噪声导致假变化 */
function signature(d) {
  return JSON.stringify([
    d.repo, d.specs.map(s => s.sessionId + s.id), d.sessions.map(s => s.id),
    d.conventions.map(c => c.rule), d.pitfalls.map(p => p.rule),
    d.batches.map(b => b.id + b.items.length), d.ready.map(r => r.key + r.count),
    d.candidates.map(c => c.key + c.count), d.stats.totalInjects, d.stats.totalInjectedTokens,
    [...d.knowledge.lifecycle, ...d.knowledge.globalLifecycle].map(x => x.key + x.state + x.injections),
    JSON.stringify(d.settings), JSON.stringify(d.autostart),
    d.stats.rules.map(r => r.key + r.before + r.after + r.injected),
  ]);
}

async function load(force) {
  if (!force && (dirty || busy)) return;      // 正在填表就不刷新
  const next = await (await fetch('/api')).json();
  const sig = signature(next);

  // 数据没变就一个 DOM 节点都不动 —— 否则每 5 秒整页重建，
  // 用户滚到一半的 diff 会被弹回顶部
  if (!force && sig === lastSig) { D = next; return; }

  // 真要重渲染时，把滚动位置存下来再还原
  const pageY = window.scrollY;
  const scrolls = {};
  document.querySelectorAll('pre.diff').forEach((el, i) => {
    const k = el.closest('.card') ? el.closest('.card').id || ('i' + i) : ('i' + i);
    if (el.scrollTop) scrolls[k] = el.scrollTop;
  });

  D = next; lastSig = sig;
  render();

  document.querySelectorAll('pre.diff').forEach((el, i) => {
    const k = el.closest('.card') ? el.closest('.card').id || ('i' + i) : ('i' + i);
    if (scrolls[k]) el.scrollTop = scrolls[k];
  });
  window.scrollTo(0, pageY);
}

/* ────────── 渲染 ────────── */
function render() {
  const d = D, s = d.stats;
  const todo = d.pendingCount + d.ready.length;

  const H = [];
  const as0 = d.autostart || {};
  H.push(`<header>
    <h1>agent-lore</h1><span class="repo">${esc(d.repo)}</span><span class="sp"></span>
    ${dirty ? '<span class="paused">编辑中 · 已暂停自动刷新</span>' : ''}
    <button class="ghost" onclick="scanNow()">扫描修正</button>
    <button class="ghost" onclick="load(true)">刷新</button>
    <button class="ghost ${settingsOpen ? 'on' : ''}" onclick="settingsOpen=!settingsOpen;render()">⚙ 设置${
      as0.drift ? ' <span class="pill bad" style="margin-left:2px">!</span>' : ''}</button>
  </header>`);

  H.push(settingsBar(d));
  H.push(scopeSection(d));

  // 状态条
  H.push(`<div class="stats">
    ${stat(d.conventions.length, '已确认规范' + (d.conventions.some(c => c.scope === 'global') ? '（含通用）' : ''))}
    ${stat(d.pitfalls.length, '踩坑记录')}
    ${stat(d.candidates.length, '候选规范')}
    ${stat(todo, '待你处理', todo > 0)}
    ${stat(s.totalInjects, '注入次数')}
    ${stat(s.totalInjectedTokens, '注入 token')}
  </div>`);

  // ── 待办：置顶，没有就不出现 ──
  if (d.ready.length) {
    H.push(`<section><h2 class="todo">待确认入库 <span class="n">${d.ready.length}</span></h2>
      ${d.ready.map(readyCard).join('')}</section>`);
  }
  if (d.batches.length) {
    H.push(`<section><h2 class="todo">待归因 <span class="n">${d.batches.length} 次交互 · ${d.pendingCount} 个文件</span>
        <span style="flex:1"></span>
        <button class="primary" onclick="autoAll()" ${d.hasApiKey ? '' : 'disabled'}>⚡ 全部自动归因</button>
      </h2>
      ${d.hasApiKey ? '' : `<div class="hint" style="margin:-2px 0 9px">
        自动归因需要设置 ANTHROPIC_API_KEY 环境变量。没有 key 时用
        <code>lore review</code> 把提示词交给当前 harness 里的模型判断，再回灌结果。</div>`}
      ${d.batches.map(batchCard).join('')}</section>`);
  }

  // ── 观测：tabs ──
  const kn = d.knowledge;
  const allLc = [...kn.lifecycle, ...kn.globalLifecycle];
  const attention = allLc.filter(x => x.state === 'stale' || x.state === 'suspect').length;

  const tabs = [
    ['know', '知识层', attention || null],
    ['conv', '规范', d.conventions.length],
    ['pit', '踩坑', d.pitfalls.length],
    ['cand', '候选进度', d.candidates.length],
    ['eff', '效果', s.rules.length],
  ];
  H.push(`<nav class="tabs">${tabs.map(([k, label, n]) =>
    `<button class="${tab === k ? 'on' : ''}" onclick="go('${k}')">${label}${n ? ` <span class="pill ${k === 'know' ? 'warn' : 'dim'}">${n}</span>` : ''}</button>`
  ).join('')}</nav><div id="panel">${panel()}</div>`);

  $('#app').innerHTML = H.join('');
}

const stat = (v, label, hot) =>
  `<div class="stat${hot ? ' hot' : ''}"><b>${v}</b><span>${label}</span></div>`;

/* ── 设置 ── */
let settingsOpen = false;
let upd = null;    // 最近一次更新检查结果

function settingsBar(d) {
  if (!settingsOpen) return '';   // 入口按钮在顶栏；这里只画展开后的面板
  const st = d.settings || {}, as = d.autostart || {};

  const sw = (on, fn, label) =>
    `<button class="${on ? 'primary' : ''}" onclick="${fn}" style="min-width:52px">${on ? '开' : '关'}</button>
     <span style="flex:1">${label}</span>`;

  return `<div class="card" style="margin-bottom:14px">
    <div class="meta" style="margin-bottom:10px"><span><b style="color:var(--fg)">设置</b></span>
      <span style="flex:1"></span>
      <button class="ghost" style="padding:0 6px" onclick="settingsOpen=false;render()">收起</button></div>

    <div style="display:flex;align-items:center;gap:10px;margin-bottom:9px">
      ${sw(as.enabled, 'toggleAutostart()', '开机自启看板')}
    </div>
    <div class="hint" style="margin:-4px 0 12px 62px">
      ${as.enabled
        ? `登录后在后台静默启动，无窗口。当前仓库 <code>${esc(as.cwd || '')}</code>`
        : '登录后自动在后台打开看板，无窗口。'}
    </div>

    <div style="display:flex;align-items:center;gap:10px;margin-bottom:9px">
      ${sw(st.autoUpdate, 'toggleAutoUpdate()', 'agent-lore 自动更新')}
      <button class="ghost" onclick="checkUpdate(false)">检查</button>
      <button class="ghost" onclick="checkUpdate(true)">立即更新</button>
    </div>
    <div class="hint" style="margin:-4px 0 12px 62px">
      ${upd ? updateLine(upd) : '只用 <code>git pull --ff-only</code>：本地有未提交改动或未推送提交时会停下来交给你处理，不自动 merge。'}
    </div>

    <div style="display:flex;align-items:center;gap:10px">
      <span style="min-width:52px;font-size:12px;color:var(--dim)">刷新</span>
      <span style="flex:1">
        ${[[0, '关闭'], [5000, '5 秒'], [15000, '15 秒'], [60000, '1 分钟']].map(([v, l]) =>
          `<button class="chip ${st.refreshMs === v ? 'on' : ''}" style="margin-right:5px"
            onclick="setRefresh(${v})">${l}</button>`).join('')}
      </span>
    </div>
    <div class="hint" style="margin:6px 0 0 62px">填表期间自动暂停刷新，不会把正在输入的内容冲掉。</div>
  </div>`;
}

function updateLine(u) {
  if (!u.ok) return `❌ ${esc(u.why)}`;
  const bits = [`分支 ${esc(u.branch)}`, `本地 ${esc(u.local)}`];
  if (u.remote) bits.push(`远程 ${esc(u.remote)}`);
  let tail = '';
  if (u.offline) tail = `　${esc(u.why)}`;
  else if (u.updated) tail = `　✅ 已更新 ${esc(u.from)} → ${esc(u.local)}，看板将自动重启`;
  else if (u.behind) tail = `　落后 ${u.behind} 个提交${u.why ? '，' + esc(u.why) : ''}`;
  else tail = '　已是最新';
  if (u.dirty) tail += '　⚠️ 本地有未提交改动';
  if (u.ahead) tail += `　本地领先 ${u.ahead} 个提交`;
  return bits.join('　') + tail;
}

async function toggleAutostart() {
  const on = !(D.autostart || {}).enabled;
  const r = await post('/api/autostart', { enable: on, cwd: null });
  // 和 beacon 一样：失败就显示原因，开关状态由 load() 拨回真实值
  if (on && r && r.ok === false) toast('启用失败：' + (r.message || '被安全软件拦截'));
  else toast(on ? '开机自启已启用，开机后无窗口后台运行' : '已关闭开机自启');
  load(true);
}

async function toggleAutoUpdate() {
  const on = !(D.settings || {}).autoUpdate;
  await post('/api/settings', { autoUpdate: on });
  toast(on ? '启动时会自动检查并快进更新' : '已关闭自动更新');
  load(true);
}

async function checkUpdate(pull) {
  toast(pull ? '正在更新…' : '正在检查…');
  upd = await post('/api/update', { pull });
  if (upd.restarting) {
    // 后端更新成功后会自动重启看板，这里等它回来再自动刷新，不用手动重开
    toast('已更新，正在重启看板…');
    render();
    return waitForRestart();
  }
  toast(!upd.ok ? upd.why
    : upd.behind ? `落后 ${upd.behind} 个提交` : '已是最新');
  render();
}

/** 轮询等看板重启完成，回来后自动刷新页面 */
async function waitForRestart() {
  for (let i = 0; i < 40; i++) {
    await new Promise(r => setTimeout(r, 500));
    try {
      const res = await fetch('/api', { cache: 'no-store' });
      if (res.ok) { toast('看板已重启，运行新版本'); location.reload(); return; }
    } catch { /* 重启中，连不上是正常的 */ }
  }
  toast('重启超时，请手动刷新页面');
}

async function setRefresh(ms) {
  await post('/api/settings', { refreshMs: ms });
  applyRefresh(ms);
  toast(ms ? `刷新间隔 ${ms / 1000} 秒` : '已关闭自动刷新');
  load(true);
}

/**
 * 需求边界区 —— 按会话分别设置。
 *
 * 同一个仓库可能同时开着多个会话做不同需求。只留一个全局输入框，
 * B 会话会被注入 A 的边界然后拒绝干活，而且这种串扰很隐蔽。
 * hook 事件里带 session_id，所以按会话隔离；没有会话时退回"仓库默认"。
 */
function scopeSection(d) {
  const ago = (t) => {
    const m = Math.round((Date.now() - t) / 60000);
    return m < 1 ? '刚刚' : m < 60 ? m + ' 分钟前' : Math.round(m / 60) + ' 小时前';
  };
  const rows = [];

  // 每个最近活跃的会话一行
  for (const s of d.sessions) {
    rows.push(s.spec
      ? `<div class="scope">
          <div class="t">🎯 ${esc(s.spec.id)}
            <span class="pill dim" style="margin-left:6px">会话 ${esc(s.short)} · ${ago(s.at)}</span></div>
          ${s.spec.scope ? `<div class="l">范围内：${esc(s.spec.scope)}</div>` : ''}
          ${(s.spec.out || []).length ? `<div class="l">不在范围：${esc(s.spec.out.join('；'))}</div>` : ''}
          <div style="margin-top:8px"><button class="ghost" onclick="clearScope('${esc(s.id)}')">结束这个需求</button></div>
        </div>`
      : `<div class="scope-set">
          <span class="pill dim" style="align-self:center;white-space:nowrap">会话 ${esc(s.short)} · ${ago(s.at)}</span>
          <input id="si-${esc(s.id)}" placeholder="这个会话在做什么需求">
          <input id="ss-${esc(s.id)}" placeholder="范围内做什么">
          <button onclick="setScope('${esc(s.id)}')">设边界</button>
        </div>`);
  }

  // 仓库默认边界：没匹配到会话时兜底（比如从 CLI 设的，或 harness 不给 session_id）
  const def = d.specs.find((s) => !s.sessionId);
  rows.push(def
    ? `<div class="scope">
        <div class="t">🎯 ${esc(def.id)} <span class="pill dim" style="margin-left:6px">仓库默认</span></div>
        ${def.scope ? `<div class="l">范围内：${esc(def.scope)}</div>` : ''}
        <div style="margin-top:8px"><button class="ghost" onclick="clearScope()">结束这个需求</button></div>
      </div>`
    : `<div class="scope-set">
        <span class="pill dim" style="align-self:center;white-space:nowrap">仓库默认</span>
        <input id="si-" placeholder="需求（例：REQ-118 payment callback idempotency）">
        <input id="ss-" placeholder="范围内做什么">
        <button onclick="setScope()">设边界</button>
      </div>`);

  if (!d.sessions.length) {
    rows.push(`<div class="hint" style="margin:-6px 0 12px">
      还没记录到活跃会话。agent 编辑过文件之后，这里会按会话分别列出，可以给每个会话单独设边界。</div>`);
  }
  return rows.join('');
}

/* ── 作用域 ── */
let scopeFilter = null;   // null=全部 | 'repo' | 'global'

/**
 * 规范有两个作用域，必须都看得见：
 *   repo   —— 本仓库规范，同步到项目 CLAUDE.md
 *   global —— 通用规范，同步到用户级 ~/.claude/CLAUDE.md，**每个会话都加载**
 * 只显示本仓库的话，真正在生效的那批反而是隐形的。
 */
function scopeChips(items) {
  const n = { repo: 0, global: 0 };
  for (const it of items) n[it.scope] = (n[it.scope] || 0) + 1;
  if (!n.repo || !n.global) return '';    // 只有一种作用域就不占地方
  const c = (k, label) =>
    `<button class="chip ${scopeFilter === k ? 'on' : ''}" onclick="setScope2(${k ? `'${k}'` : 'null'})">${label}</button>`;
  return `<div class="chips" style="margin-bottom:7px">
    ${c(null, '全部 ' + items.length)}${c('repo', '本仓库 ' + n.repo)}${c('global', '通用 ' + n.global)}
  </div>`;
}

function setScope2(k) { scopeFilter = (scopeFilter === k) ? null : k; render(); }

const byScope = (items) => scopeFilter ? items.filter((i) => i.scope === scopeFilter) : items;

const scopePill = (it) => it.scope === 'global'
  ? `<span class="pill dim" style="margin-left:5px">通用</span>` : '';

/* ── 标签 ── */
let tagFilter = null;

function tagChips(items) {
  const counts = new Map();
  for (const it of items) counts.set(it.tag, (counts.get(it.tag) || 0) + 1);
  if (counts.size < 2) return '';
  const L = D.tagLabels || {};
  const chips = [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  return `<div class="chips">
    <button class="chip ${tagFilter ? '' : 'on'}" onclick="setTag(null)">全部 ${items.length}</button>
    ${chips.map(([t, n]) =>
      `<button class="chip ${tagFilter === t ? 'on' : ''}" onclick="setTag('${t}')">${esc(L[t] || t)} ${n}</button>`
    ).join('')}</div>`;
}

function setTag(t) { tagFilter = (tagFilter === t) ? null : t; render(); }

const byTag = (items) => tagFilter ? items.filter((i) => i.tag === tagFilter) : items;

/** 按标签分组渲染。未筛选时按组显示小标题；已筛选时直接平铺 */
function grouped(items, cardFn) {
  const L = D.tagLabels || {};
  if (tagFilter) return items.map(cardFn).join('');
  const m = new Map();
  for (const it of items) { if (!m.has(it.tag)) m.set(it.tag, []); m.get(it.tag).push(it); }
  return [...m.entries()]
    .sort((a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0]))
    .map(([t, g]) => `<div class="grp">${esc(L[t] || t)} <span class="pill dim">${g.length}</span></div>`
      + g.map(cardFn).join('')).join('');
}

function diffHtml(t) {
  return '<pre class="diff">' + String(t).split('\n').map(l =>
    `<div class="${l.startsWith('+') ? 'a' : l.startsWith('-') ? 'd' : ''}">${esc(l) || '&nbsp;'}</div>`
  ).join('') + '</pre>';
}

/**
 * 待归因卡片 —— 单位是**一次交互**，不是一个文件的 diff。
 *
 * 一次需求改动常横跨多个文件，逐个文件归因既重复、模型又缺跨文件上下文。
 * 所以按 (session_id + 时间邻近) 聚成批次，整批一次判断。
 * 计数上一个批次只算一次证据 —— 否则单次交互就能顶到升格阈值。
 */
let splitOpen = {};   // 批次 id → 是否展开成逐条

function batchCard(b) {
  const single = b.items.length === 1;
  const files = b.items.map((it, i) => `
    <div style="margin-top:${i ? 10 : 8}px">
      <div class="meta" style="margin-bottom:4px">
        <span>${esc(base(it.file))}</span><span>${it.hunkCount} 处改动</span>
        ${splitOpen[b.id] ? `<button class="ghost" style="padding:0 6px;font-size:11px"
          onclick="pickOne('${it.id}','style')">单独归因</button>
          <button class="ghost" style="padding:0 6px;font-size:11px"
          onclick="drop('${it.id}')">单独丢弃</button>` : ''}
      </div>
      ${diffHtml(it.diff)}
      ${splitOpen[b.id] ? oneForm(it.id) : ''}
    </div>`).join('');

  return `<div class="card act" id="c-${b.id}">
    <div class="meta">
      <span><b style="color:var(--fg)">${b.items.length} 个文件</b></span>
      <span>共 ${b.hunks} 处改动</span>
      <span>AI 写完 ${b.ageMin} 分钟后被改</span>
      ${b.sessionId ? `<span>会话 ${esc(String(b.sessionId).slice(0, 8))}</span>` : '<span>无会话信息</span>'}
    </div>
    ${files}
    <div class="acts">
      <button class="primary" onclick="pick('${b.id}','style')">🎨 规范修正</button>
      <button onclick="pick('${b.id}','bug')">🐛 修复缺陷</button>
      <button class="ghost" onclick="dropBatch('${b.id}')">📦 业务变更 · 丢弃整批</button>
      ${single ? '' : `<span style="flex:1"></span>
        <button class="ghost" onclick="toggleSplit('${b.id}')">${
          splitOpen[b.id] ? '合起来整批处理' : '这批不是同一件事 · 拆开'}</button>`}
    </div>
    <div class="form" id="f-${b.id}">
      <label id="l-${b.id}"></label>
      <textarea id="r-${b.id}" oninput="dirty=true"
        placeholder="Write the rule in English, e.g. Inject Spring bean dependencies via constructor, not @Autowired field injection"></textarea>
      <div class="row">
        ${confSelect(b.id)}
        <button class="primary" onclick="submitBatch('${b.id}')">提交${single ? '' : `（整批算 1 次证据）`}</button>
        <button class="ghost" onclick="cancel('${b.id}')">取消</button>
        <span class="hint">写成可复用的一般陈述，不要提具体变量名</span>
      </div>
    </div>
  </div>`;
}

const confSelect = (id) => `<select id="cf-${id}">
  <option value="0.95">很确定</option>
  <option value="0.85" selected>比较确定</option>
  <option value="0.6">不太确定（低于闸门，会被丢弃）</option>
</select>`;

const oneForm = (id) => `<div class="form" id="f-${id}" style="margin-top:8px">
  <label id="l-${id}"></label>
  <textarea id="r-${id}" oninput="dirty=true" placeholder="Write the rule in English"></textarea>
  <div class="row">${confSelect(id)}
    <button class="primary" onclick="submitOne('${id}')">提交这一条</button>
    <button class="ghost" onclick="cancel('${id}')">取消</button></div>
</div>`;

function toggleSplit(id) { splitOpen[id] = !splitOpen[id]; render(); }

/* 达阈值但没够格自动入库的 —— 必须说清楚"为什么还要问你" */
function readyCard(r) {
  const A = D.autoRule || {};
  const why = [];
  if (r.related && r.related.length) {
    why.push(`与已有规范话题重叠 —— <b>重复还是冲突，相似度判不出来，只能你看</b>`);
  }
  if (r.avgConfidence < (A.minAvgConfidence || 0.9)) {
    why.push(`归因平均置信度 ${r.avgConfidence}，低于自动入库线 ${A.minAvgConfidence}`);
  }
  if (r.count < (A.minCount || 5)) {
    why.push(`累计 ${r.count} 次，未达自动入库线 ${A.minCount} 次`);
  }

  return `<div class="card act">
    <div class="rule">${esc(r.rule)}</div>
    <div class="meta" style="margin:8px 0 0">
      <span>累计 ${r.count} 次</span><span>置信度 ${r.avgConfidence}</span>
      <span>${r.files.length} 个文件</span><span>${esc(r.key)}</span></div>
    ${why.length ? `<div class="hint" style="margin-top:7px">需要你确认：${why.join('；')}</div>` : ''}
    ${(r.related || []).map(x =>
      `<div class="hint" style="margin-top:4px">↔ 相关已有规范（${x.sim.toFixed(2)}）：${esc(x.existing)}</div>`).join('')}
    <div class="acts">
      <button class="primary" onclick="confirmRule('${r.key}')">✓ 确认入库</button>
    </div>
  </div>`;
}

const tagLine = (it) => (it.tags || []).length > 1
  ? `<div style="margin-top:7px">${it.tags.map(t =>
      `<span class="pill dim" style="margin-right:4px">${esc((D.tagLabels || {})[t] || t)}</span>`).join('')}</div>`
  : '';

/**
 * 知识层视图 —— 文件存储之上的一层，不引入新数据，
 * 只把已有数据里隐含的关系显式化：生命周期、覆盖分布、关系密度。
 *
 * 一个知识库最大的问题不是存不下，是**存了一堆没人用、或用了没效果的东西**，
 * 而这两种都不会自己冒出来说话。所以「需要关注」置顶。
 */
const STATE_CLS = {
  effective: 'ok', partial: 'warn', suspect: 'bad', stale: 'bad',
  fresh: 'dim', candidate: 'dim',
};

function knowledgePanel() {
  const d = D, kn = d.knowledge;
  const L = kn.stateLabel;
  const all = [...kn.lifecycle, ...kn.globalLifecycle];
  if (!all.length) return `<div class="empty">知识库还是空的</div>`;

  const H = [];

  // ① 需要关注：过时与无效
  const attention = all.filter(x => x.state === 'stale' || x.state === 'suspect');
  if (attention.length) {
    H.push(`<div class="grp" style="color:var(--warn)">需要关注 <span class="pill warn">${attention.length}</span></div>`);
    for (const x of attention) {
      H.push(`<div class="card act"><div class="rule">${esc(x.rule)}</div>
        <div class="hint" style="margin-top:6px"><span class="pill ${STATE_CLS[x.state]}">${esc(L[x.state])}</span>　${esc(x.why)}</div>
        <div class="acts"><button class="ghost" onclick="showWhy('${x.key}')">看血缘</button></div>
        <div id="why-${x.key}"></div></div>`);
    }
  }

  // ② 生命周期分布
  const by = {};
  all.forEach(x => { by[x.state] = (by[x.state] || 0) + 1; });
  H.push(`<div class="grp">生命周期</div><div class="card">`);
  for (const [st, n] of Object.entries(by).sort((a, b) => b[1] - a[1])) {
    H.push(`<div style="display:flex;align-items:center;gap:9px;margin-bottom:5px">
      <span style="width:64px;font-size:12px;color:var(--dim)">${esc(L[st] || st)}</span>
      <span style="width:28px;text-align:right;font-variant-numeric:tabular-nums">${n}</span>
      <span class="bar" style="flex:1;margin:0"><i style="width:${(n / all.length * 100).toFixed(0)}%"></i></span>
    </div>`);
  }
  H.push(`</div>`);

  // ③ 覆盖地图
  const cv = kn.coverage;
  H.push(`<div class="grp">覆盖地图 <span class="pill dim">${cv.total} 条</span></div><div class="card">`);
  const max = Math.max(...cv.byTag.map(t => t.convention + t.pitfall), 1);
  for (const t of cv.byTag.slice(0, 12)) {
    const n = t.convention + t.pitfall;
    H.push(`<div style="display:flex;align-items:center;gap:9px;margin-bottom:5px">
      <span style="width:88px;font-size:12px;color:var(--dim)">${esc((d.tagLabels || {})[t.tag] || t.tag)}</span>
      <span style="width:24px;text-align:right;font-variant-numeric:tabular-nums">${n}</span>
      <span class="bar" style="flex:1;margin:0"><i style="width:${(n / max * 100).toFixed(0)}%"></i></span>
    </div>`);
  }
  if (cv.gaps.length) {
    H.push(`<div class="hint" style="margin-top:9px">空白域：${cv.gaps.map(g =>
      `<span class="pill dim" style="margin-right:4px">${esc((d.tagLabels || {})[g] || g)}</span>`).join('')}
      <br>要么那里没踩过坑，要么踩了没沉淀。<b>空白比密集更有信息量。</b></div>`);
  }
  H.push(`</div>`);

  // ④ 关系密度
  const g = kn.graph;
  const clustered = g.nodes.length - g.isolated;
  H.push(`<div class="grp">知识关联</div><div class="card">
    <div class="meta" style="margin:0"><span>${g.nodes.length} 条规范</span>
      <span>${g.edges.length} 条关联</span><span>${g.isolated} 个孤立</span></div>
    <div class="bar" style="margin-top:8px"><i style="width:${(clustered / Math.max(g.nodes.length, 1) * 100).toFixed(0)}%"></i></div>
    <div class="hint" style="margin-top:7px">${g.isolated > g.nodes.length * 0.6
      ? '孤立点占多数 —— 当前是一堆互不相关的经验，尚未在某个领域成体系。<b>同一领域的规范互相关联，才构成体系。</b>'
      : `${clustered} 条已与其它规范关联，知识开始成体系。`}</div>
  </div>`);

  // ⑤ 全部规范，按状态排序
  const order = ['suspect', 'stale', 'partial', 'effective', 'fresh', 'candidate'];
  H.push(`<div class="grp">全部规范</div>`);
  for (const x of [...all].sort((a, b) => order.indexOf(a.state) - order.indexOf(b.state))) {
    H.push(`<div class="card"><div class="rule">${esc(x.rule)}</div>
      <div class="meta" style="margin:8px 0 0">
        <span class="pill ${STATE_CLS[x.state]}">${esc(L[x.state])}</span>
        <span>注入 ${x.injections} 次</span>
        <span>复发 ${x.recurrence.before} → ${x.recurrence.after}</span>
        <span>${x.source === 'seed' ? '初始化' : x.source === 'bootstrap' ? '代码库归纳' : x.evidence + ' 次修正'}</span>
        ${x.related ? `<span>${x.related} 条相关</span>` : ''}
        <button class="ghost" style="padding:0 6px;font-size:11px" onclick="showWhy('${x.key}')">血缘</button>
      </div><div id="why-${x.key}"></div></div>`);
  }
  return H.join('');
}

/** 展开一条规则的完整血缘：证据 diff、来源文件、相关规范 */
async function showWhy(key) {
  const box = document.getElementById('why-' + key);
  if (!box) return;
  if (box.innerHTML) { box.innerHTML = ''; return; }
  const scope = D.knowledge.lifecycle.some(x => x.key === key) ? D.repo : '_global';
  const g = await post('/api/why', { key, repo: scope });
  if (!g || g.ok === false) { box.innerHTML = `<div class="hint">${esc((g && g.why) || '未找到')}</div>`; return; }
  const H = [`<div class="hint" style="margin-top:9px">
    标签 ${g.tags.map(t => esc((D.tagLabels || {})[t] || t)).join('、')}
    ${g.files.length ? '　涉及 ' + g.files.map(f => esc(base(f))).join('、') : ''}
    ${g.injectedTokens ? '　累计注入 ' + g.injectedTokens + ' token' : ''}</div>`];
  if (g.related.length) {
    H.push(`<div class="hint" style="margin-top:6px">相关规范：</div>`);
    g.related.forEach(r => H.push(`<div class="hint">　${r.sim.toFixed(2)}　${esc(r.existing)}</div>`));
  }
  if (g.evidence.length) {
    H.push(`<div class="hint" style="margin-top:6px">证据 diff：</div>`);
    g.evidence.slice(0, 2).forEach(e => H.push(
      `<div class="hint" style="margin-top:4px">── ${esc(base(e.file || '?'))} ──</div>` + diffHtml(e.diff || '')));
  } else {
    H.push(`<div class="hint" style="margin-top:6px">无证据 diff —— 这条是初始化或代码库归纳得来的</div>`);
  }
  box.innerHTML = H.join('');
}

function panel() {
  const d = D, s = d.stats;
  if (tab === 'know') return knowledgePanel();
  if (tab === 'conv') {
    if (!d.conventions.length) return `<div class="empty">还没有已确认的规范</div>`;
    const scoped = byScope(d.conventions);
    return `<div style="margin-bottom:9px"><button onclick="sync(false)">同步到项目 CLAUDE.md</button>
      <button onclick="sync(true)">同步到用户级 CLAUDE.md</button>
      <span class="hint" style="margin-left:8px">「通用」那批写在 ~/.claude/CLAUDE.md，每个会话都加载</span></div>`
      + scopeChips(d.conventions) + tagChips(scoped)
      + grouped(byTag(scoped), c =>
          `<div class="card"><div class="rule">${esc(c.rule)}${scopePill(c)}</div>${tagLine(c)}</div>`);
  }
  if (tab === 'pit') {
    if (!d.pitfalls.length) return `<div class="empty">还没有踩坑记录</div>`;
    const sp = byScope(d.pitfalls);
    return scopeChips(d.pitfalls) + tagChips(sp) + grouped(byTag(sp), p =>
      `<div class="card"><div class="rule">${esc(p.rule)}${scopePill(p)}</div>
        <div class="meta" style="margin:7px 0 0"><span>${esc(base(p.file))}</span></div>${tagLine(p)}</div>`);
  }
  if (tab === 'cand') {
    if (!d.candidates.length) return `<div class="empty">还没有候选规范。候选累计 ${d.threshold} 次才会升格</div>`;
    return d.candidates.map(c => {
      const pct = Math.min(100, Math.round(c.count / c.threshold * 100));
      return `<div class="card"><div class="rule">${esc(c.rule)}</div>
        <div class="meta" style="margin:8px 0 0"><span>${c.count} / ${c.threshold} 次</span>
          <span>${c.files.length} 个文件</span></div>
        <div class="bar"><i style="width:${pct}%"></i></div></div>`;
    }).join('');
  }
  // 效果
  if (!s.rules.length) return `<div class="empty">还没有已入库的规范，无法统计复发率</div>`;
  return `<div class="card" style="background:none;border-style:dashed">
      <div class="meta" style="margin:0"><span>注入 ${s.totalInjects} 次</span>
        <span>累计 ${s.totalInjectedTokens} token</span>
        <span>命中率 ${(s.hitRate * 100).toFixed(0)}%</span></div>
      <div class="hint" style="margin-top:6px">规范入库后，同类人工修正应当下降。注入次数为 0 时不能下结论 —— 要能区分"规范没用"和"注入没生效"。</div>
    </div>`
    + scopeChips(s.rules) + tagChips(byScope(s.rules))
    + grouped(byTag(byScope(s.rules)), r => {
      const cls = r.verdict.startsWith('✅') ? 'ok' : r.verdict.startsWith('🟡') ? 'warn'
                : r.verdict.startsWith('❌') ? 'bad' : 'dim';
      return `<div class="card"><div class="rule">${esc(r.rule)}${scopePill(r)}</div>
        <div class="meta" style="margin:8px 0 0">
          <span>入库前 ${r.before} 次 → 入库后 ${r.after} 次</span>
          <span>注入 ${r.injected} 次</span></div>
        <div style="margin-top:7px"><span class="pill ${cls}">${esc(r.verdict)}</span>${
          (r.tags || []).map(t => `<span class="pill dim" style="margin-left:4px">${
            esc((D.tagLabels || {})[t] || t)}</span>`).join('')}</div></div>`;
    });
}

/* ────────── 交互 ────────── */
function go(k) { tab = k; render(); }

function pick(id, label) {
  const f = document.getElementById('f-' + id);
  f.classList.add('on');
  f.dataset.label = label;
  document.getElementById('l-' + id).textContent =
    label === 'style' ? '这条规范是什么？（会进 CLAUDE.md，所以用英文）'
                      : '这个坑是什么？（会在编辑该文件前注入，所以用英文）';
  document.getElementById('r-' + id).focus();
  dirty = true;
}

function cancel(id) {
  document.getElementById('f-' + id).classList.remove('on');
  dirty = false;
}

async function submitBatch(bid) {
  const b = D.batches.find(x => x.id === bid);
  if (!b) return;
  await doSubmit(bid, b.items.map(i => i.id));
}

async function submitOne(id) { await doSubmit(id, [id]); }

function pickOne(id, label) { pick(id, label); }

async function doSubmit(formId, ids) {
  const f = document.getElementById('f-' + formId);
  const id = formId;
  const rule = document.getElementById('r-' + id).value.trim();
  if (!rule) return toast('先写一句规范');

  // 兜底：select 取不到有效值时会得到 NaN/0，那会让这条被置信度闸静默丢掉。
  // UI 出岔子不该导致数据丢失 —— 拿不到就按默认档走。
  const raw = Number(document.getElementById('cf-' + id).value);
  const confidence = Number.isFinite(raw) && raw > 0 ? raw : 0.85;

  const r = await post('/api/learn', { ids, label: f.dataset.label, rule, confidence });
  dirty = false;
  const auto = (r.autoPromoted || []).length;
  toast(!r.ok ? '已丢弃：' + r.why
      : r.kind === 'pitfall' ? '已记为踩坑'
      : `规范候选 ${r.count}/${r.threshold}`
        + (r.batchSize > 1 ? `（${r.batchSize} 个文件算 1 次）` : '')
        + (r.count >= r.threshold ? ' · 已达阈值' : '')
        + (auto ? ` · ${auto} 条已自动入库` : ''));
  load(true);
}

/** 一键批量归因。没有 API key 时给降级路径，而不是干瞪眼 */
async function autoAll() {
  toast('正在归因…');
  const r = await post('/api/auto', {});
  if (!r.ok) return toast(r.why);
  const auto = (r.autoPromoted || []).length;
  toast(r.done
    ? `归因 ${r.done} 条：保留 ${r.kept}，丢弃 ${r.dropped}` + (auto ? ` · ${auto} 条自动入库` : '')
    : r.why);
  load(true);
}

async function drop(id) { await post('/api/dismiss', { id }); dirty = false; toast('已丢弃'); load(true); }

async function dropBatch(bid) {
  const b = D.batches.find(x => x.id === bid);
  if (!b) return;
  await post('/api/dismiss', { ids: b.items.map(i => i.id) });
  dirty = false; toast(`已丢弃 ${b.items.length} 个文件`); load(true);
}

async function confirmRule(key) {
  const r = await post('/api/promote', { key });
  toast(r.ok ? '已入库' : r.why); load(true);
}

async function sync(global) {
  const r = await post('/api/sync', { global });
  toast(!r.written ? r.reason : r.verified ? `${r.count} 条已写入 ${global ? '用户级' : '项目'} CLAUDE.md`
        : `写入未生效（期望 ${r.count}，实际 ${r.actual}）`);
}

async function scanNow() {
  const r = await post('/api/scan', {});
  toast(r.found ? `捕获 ${r.found} 处人工修正` : '没有新的人工修正');
  load(true);
}

async function setScope(sessionId) {
  const suffix = sessionId || '';
  const id = document.getElementById('si-' + suffix).value.trim();
  if (!id) return toast('先填需求名');
  await post('/api/spec', {
    id, scope: document.getElementById('ss-' + suffix).value.trim(), out: [], sessionId: sessionId || null,
  });
  toast(sessionId ? '边界已设置，只对这个会话生效' : '仓库默认边界已设置');
  load(true);
}

async function clearScope(sessionId) {
  await post('/api/spec', { clear: true, sessionId: sessionId || null });
  toast('已结束'); load(true);
}

/** 刷新间隔可配。0 = 关闭轮询——有人不想让它一直转 */
let refreshTimer = null;
function applyRefresh(ms) {
  clearInterval(refreshTimer);
  refreshTimer = ms ? setInterval(() => load(false), ms) : null;
}

load(true).then(() => applyRefresh((D.settings || {}).refreshMs ?? 5000));
</script>
